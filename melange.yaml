# $schema:https://raw.githubusercontent.com/chainguard-dev/melange/main/pkg/config/schema.json
package:
  name: gh-app-auth
  version: "0.2.0"
  epoch: 6
  description: Get a GitHub App Installation Token for authentication
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime: []

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 33f12975253ebd1cf360734056b77016db6c99a2
      repository: https://github.com/rbrownwsws/gh-app-auth
      tag: v${{package.version}}

  - uses: cargo/build
    with:
      output: gh-app-auth

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages: []
